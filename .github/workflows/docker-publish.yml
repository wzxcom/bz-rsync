name: Publish Docker Hub image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git release tag to build
        required: true
        default: v1.0.1
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Validate publication target
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a tag such as v1.0.0'; exit 1; }
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Set DOCKERHUB_USERNAME'; exit 1; }
          [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Set a valid Docker Hub namespace'; exit 1; }

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Verify source version
        shell: bash
        run: test "$RELEASE_TAG" = "v$(tr -d '\r\n' < VERSION)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/bz-rsync:${{ inputs.release_tag }}
          labels: |
            org.opencontainers.image.title=bz-rsync
            org.opencontainers.image.version=${{ inputs.release_tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
